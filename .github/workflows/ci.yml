name: CI

on: 
  push:
    branches: [ master ]
  pull_request:
jobs:
  SHA256_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make run_sha256
    
      - name: Cross-compile for target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc -c -std=c11 -Wall -Wextra \
            -mcpu=cortex-m4 -mthumb -I./bootloader/SHA_256 \
            bootloader/SHA_256/sha_256.c -o /dev/null
  
  MICRO_ECC_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test ECC
        run: make run_ecc

      - name: Cross-compile for target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc -c -std=c11 -Wall -Wextra -Wno-unused-parameter \
            -mcpu=cortex-m4 -mthumb \
            -I./bootloader/third_party/micro-ecc \
            bootloader/src/uECC.c -o /dev/null

  format_sync_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install signing tool dependencies
        run: pip install cryptography

      - name: Check sign_image.py header layout matches img_header.h
        run: make run_format_sync