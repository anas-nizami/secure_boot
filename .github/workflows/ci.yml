name: CI

on: [push, pull_request]

jobs:
  sha_imp_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and test
        run: make run_sha256
    
      - name: Cross-compile for target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc -c -std=c11 -Wall -Wextra \
            -mcpu=cortex-m4 -mthumb -I./bootloader/SHA_256 \
            bootloader/SHA_256/sha_256.c -o /dev/null
  
  verify_ecc_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test ECC
        run: make run_ecc
      
      - name: Cross-compile for target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc -c -std=c11 -Wall -Wextra -Wno-unused-parameter \
            -mcpu=cortex-m4 -mthumb \
            -I./bootloader/third_party/micro-ecc \
            bootloader/third_party/micro-ecc/uECC.c -o /dev/null