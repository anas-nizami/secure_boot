name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: make run

      - name: Sanitizers
        run: |
          make clean
          make run CFLAGS="-std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined,address"

      - name: Cross-compile for target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc -c -std=c11 -Wall -Wextra -Werror \
            -mcpu=cortex-m4 -mthumb -I./SHA_256 SHA_256/sha_256.c -o /dev/null